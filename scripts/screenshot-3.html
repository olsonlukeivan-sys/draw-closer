<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 0; width: 1284px; height: 2778px; overflow: hidden; }
  .screen {
    width: 1284px;
    height: 2778px;
    background: #1E1930;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 200px 88px 180px;
  }

  /* Progress dots */
  .dots {
    display: flex;
    gap: 20px;
    margin-bottom: 0;
  }
  .dot {
    width: 20px;
    height: 20px;
    border-radius: 10px;
    background: #2C2440;
  }
  .dot.active {
    background: #DDA94E;
    width: 64px;
  }

  .spacer-top { flex: 1; }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 128px;
    line-height: 1.08;
    color: #EFE6D5;
    margin-bottom: 60px;
    letter-spacing: -1px;
  }
  .body {
    font-family: 'DM Sans', sans-serif;
    font-size: 52px;
    line-height: 1.65;
    color: #A89EC0;
    margin-bottom: 0;
  }

  .spacer-bottom { flex: 2; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  .btn-primary {
    background: #2C2440;
    border: 3px solid #DDA94E;
    border-radius: 36px;
    padding: 60px;
    text-align: center;
  }
  .btn-primary-text {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 50px;
    color: #DDA94E;
  }
  .btn-skip {
    text-align: center;
    padding: 36px;
  }
  .btn-skip-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 44px;
    color: #8E86A0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="spacer-top"></div>

    <div class="title">Draw<br>Closer.</div>
    <div class="body">A daily ritual for the<br>people who matter most.<br><br>Each day, two new cards.<br>Each card, a question<br>worth asking.</div>

    <div class="spacer-bottom"></div>

    <div class="actions">
      <div class="btn-primary">
        <div class="btn-primary-text">Get started</div>
      </div>
      <div class="btn-skip">
        <div class="btn-skip-text">Maybe later</div>
      </div>
    </div>
  </div>
</body>
</html>
