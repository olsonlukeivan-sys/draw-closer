<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 0; width: 1284px; height: 2778px; overflow: hidden; }
  .screen {
    width: 1284px;
    height: 2778px;
    background: #1E1930;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 200px 88px 180px;
  }
  .symbol {
    font-size: 88px;
    color: #DDA94E;
    line-height: 1;
    margin-bottom: 52px;
    font-family: serif;
  }
  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 128px;
    line-height: 1.08;
    color: #EFE6D5;
    letter-spacing: -1px;
    margin-bottom: 48px;
  }
  .subhead {
    font-family: 'DM Sans', sans-serif;
    font-size: 48px;
    color: #8E86A0;
    line-height: 1.5;
  }
  .spacer { flex: 1; }
  .label {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 36px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #8E86A0;
    margin-bottom: 44px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 48px;
  }
  .card-front {
    height: 740px;
    background: #EFE6D5;
    border-radius: 44px;
    display: flex;
    align-items: center;
    padding: 72px 80px;
  }
  .question {
    font-family: 'DM Sans', sans-serif;
    font-size: 62px;
    line-height: 1.45;
    color: #2A211B;
  }
  .card-back {
    height: 740px;
    background: #2C2440;
    border: 2px solid rgba(221,169,78,0.45);
    border-radius: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 22px;
  }
  .card-symbol {
    font-size: 76px;
    color: #DDA94E;
    line-height: 1;
    font-family: serif;
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 48px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #DDA94E;
  }
  .card-hint {
    font-family: 'DM Sans', sans-serif;
    font-size: 34px;
    color: #C58A72;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="symbol">✦</div>
    <div class="headline">Tap to reveal.</div>
    <div class="subhead">Read it out loud.<br>Put the phone down. Talk.</div>
    <div class="spacer"></div>
    <div class="label">Today's cards</div>
    <div class="cards">
      <div class="card-front">
        <div class="question">What's a moment from this week you want to hold onto?</div>
      </div>
      <div class="card-back">
        <div class="card-symbol">✦</div>
        <div class="card-title">Draw Closer</div>
        <div class="card-hint">tap to reveal</div>
      </div>
    </div>
  </div>
</body>
</html>
