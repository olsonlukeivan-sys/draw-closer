<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .icon {
    width: 1024px;
    height: 1024px;
    background: #1E1930;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 28px;
    flex-shrink: 0;
  }
  .symbol {
    font-size: 260px;
    color: #DDA94E;
    line-height: 1;
    font-family: serif;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 12px;
    text-transform: uppercase;
    color: #DDA94E;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="symbol">✦</div>
    <div class="wordmark">Draw Closer</div>
  </div>
</body>
</html>
