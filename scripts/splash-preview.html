<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .splash {
    width: 1284px;
    height: 2778px;
    background: #1E1930;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 36px;
    flex-shrink: 0;
  }
  .symbol {
    font-size: 160px;
    color: #DDA94E;
    line-height: 1;
    font-family: serif;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-size: 88px;
    font-weight: 400;
    color: #EFE6D5;
    letter-spacing: 2px;
  }
  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-size: 36px;
    color: #8E86A0;
    letter-spacing: 1px;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="symbol">✦</div>
    <div class="wordmark">Draw Closer</div>
    <div class="tagline">a daily ritual</div>
  </div>
</body>
</html>
